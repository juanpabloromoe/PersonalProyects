<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Personal Projects</title>
<style>
:root{--bg:#EEF1EF;--panel:#fff;--ink:#18221F;--muted:#5B6863;--line:#D3DAD6;--accent:#0E5A66}
@media (prefers-color-scheme:dark){:root{--bg:#111816;--panel:#18211F;--ink:#E4ECE8;--muted:#97A7A0;--line:#2C3935;--accent:#5FB7C4}}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto;padding:40px 16px}
h1{margin:0 0 6px;font-size:28px}p{color:var(--muted);margin:0 0 24px}
a.card{display:block;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;color:inherit;text-decoration:none}
a.card:hover{border-color:var(--accent)}a.card b{color:var(--accent);font-size:17px}a.card span{display:block;color:var(--muted);font-size:14px;margin-top:4px}
</style>
</head>
<body><main>
<h1>Personal Projects</h1>
<p>Free tools anyone can use.</p>
<a class="card" href="cv-workbench/"><b>CV Workbench</b><span>Tailor a CV for every internship application: US, German, European, Spanish and Mexican formats, cover letters and an application tracker. Your data stays in your browser.</span></a>
</main></body>
</html>
